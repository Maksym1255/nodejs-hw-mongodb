tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the contacts list.
security:
  - bearerAuth: []
requestBody:
  description: Contact data to create
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact`s name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: +00(000)0000000
          email:
            description: 'Contact`s email'
            type: string
            example: 'test@test.com'
          isFavourite:
            description: 'Contact is favourite'
            type: boolean
            example: false
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: 'Contact`s photo'
            type: string
            format: binary
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Invalid input.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Name, phoneNumber, and contactType are required fields'
