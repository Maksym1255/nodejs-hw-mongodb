tags:
  - Contacts
summary: Get a list of contacts
operationId: getContacts
description: Retrieve a list of contacts with optional filters.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: The page number for pagination.
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      default: 10
    description: The number of contacts per page.
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
    description: The field to sort contacts by.
    example: 'name'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
    description: The order of sorting, either ascending (asc) or descending (desc).
    example: 'asc'
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by favourite status.
    example: true
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
    description: Filter contacts by contact type.
    example: 'personal'
responses:
  '200':
    description: Paginated list of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
