tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContact
description: Delete a contact from the contacts list by their ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: The unique identifier of the contact
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
  '204':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 204
  '404':
    $ref: ../../../components/responses/404.yaml
